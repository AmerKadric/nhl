[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "puckiq"
version = "0.1.0"
description = "PUCKIQ NHL final-score forecasting engine"
requires-python = ">=3.12"
# Runtime: everything needed to serve the API and read the database.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "requests>=2.31",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "tzdata",
]

[project.optional-dependencies]
# Modelling: needed to tune, backtest, train and run the pipeline.
train = ["scipy>=1.11", "statsmodels>=0.14", "lightgbm>=4.3"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
puckiq = "puckiq.cli:main"

[tool.setuptools.packages.find]
include = ["puckiq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Vercel deploys the API as one function from this module.
[tool.vercel]
entrypoint = "puckiq.api.main:app"
