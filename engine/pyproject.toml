[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "puckiq"
version = "0.1.0"
description = "PUCKIQ NHL final-score forecasting engine"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "statsmodels>=0.14",
  "requests>=2.31",
  "sqlalchemy>=2.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
puckiq = "puckiq.cli:main"

[tool.setuptools.packages.find]
include = ["puckiq*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
