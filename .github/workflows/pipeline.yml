name: pipeline

# Runs the forecasting pipeline against the production database.
# Requires the DATABASE_URL repository secret (PostgreSQL). Until it is set,
# every run exits early without doing anything.
on:
  schedule:
    - cron: "0 13 * * *"               # full daily run, after MoneyPuck's overnight update
    # Light refresh every 30 minutes through the evening game window (UTC):
    # picks up confirmed goalies and settles finished games. Kept to this
    # window so a private repository stays inside the free Actions minutes.
    - cron: "*/30 22-23,0-4 * * *"
    # Weekend afternoon games start as early as 17:00 UTC.
    - cron: "*/30 16-21 * * 6,0"
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        default: daily
        options: [daily, refresh, bootstrap, alert-test]

permissions:
  contents: read
  issues: write   # to open an issue when a run fails

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PUCKIQ_LOG_JSON: "1"
    steps:
      - name: Stop if the database is not configured
        id: guard
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set; skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.configured == 'true'
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.configured == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Restore downloaded files and the completed-season cache
        if: steps.guard.outputs.configured == 'true'
        uses: actions/cache@v4
        with:
          path: |
            data/raw
            data/cache
          key: data-${{ github.run_id }}
          restore-keys: data-
      - run: pip install -e "engine[train]"
        if: steps.guard.outputs.configured == 'true'
      - name: Choose job
        if: steps.guard.outputs.configured == 'true'
        id: job
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 13 * * *" ]; then
            echo "name=daily" >> "$GITHUB_OUTPUT"
          else
            echo "name=refresh" >> "$GITHUB_OUTPUT"
          fi
      - name: Bootstrap (one-off history load, backtest, first model)
        if: steps.guard.outputs.configured == 'true' && steps.job.outputs.name == 'bootstrap'
        run: |
          puckiq ingest-history
          puckiq backtest
          puckiq daily --retrain
      - name: Daily
        if: steps.guard.outputs.configured == 'true' && steps.job.outputs.name == 'daily'
        # --strict: a failed step fails the run even if forecasts were still published
        run: puckiq daily --strict
      - name: Refresh
        if: steps.guard.outputs.configured == 'true' && steps.job.outputs.name == 'refresh'
        run: puckiq refresh
      - name: Alert test (fails on purpose to exercise the failure alert)
        if: steps.guard.outputs.configured == 'true' && steps.job.outputs.name == 'alert-test'
        run: |
          echo "Deliberate failure to test alerting."
          exit 1
      # GitHub emails the repository owner about new issues, so a broken run
      # is noticed the same day. Daily failures add a comment each time;
      # refresh failures only open an issue if none is open, so an outage
      # during the evening does not produce a message every half hour.
      - name: Open or update an issue when the run fails
        if: failure() && steps.guard.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB: ${{ steps.job.outputs.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="PUCKIQ pipeline run failed"
          body="The \`$JOB\` job failed at $(date -u +%Y-%m-%dT%H:%MZ). Forecasts and results may be out of date until it is fixed.

          Run log: $RUN_URL"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -z "$number" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          elif [ "$JOB" != "refresh" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
      - name: Report data freshness
        if: always() && steps.guard.outputs.configured == 'true'
        run: puckiq status >> "$GITHUB_STEP_SUMMARY" || true
